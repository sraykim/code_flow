<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<!--__CF_CSP__-->
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Code Flow</title>
<style nonce="__CF_NONCE__">
body {
  --bg: var(--vscode-editor-background, #f4f3ef);
  --grid: color-mix(in srgb, var(--fg) 9%, transparent);
  --panel: var(--vscode-editorWidget-background, #ffffff);
  --panel-2: color-mix(in srgb, var(--fg) 4%, var(--panel));
  --fg: var(--vscode-editor-foreground, #1d1d1b);
  --muted: var(--vscode-descriptionForeground, #6c6960);
  --border: var(--vscode-editorWidget-border, #d8d5cb);
  --focus: var(--vscode-focusBorder, #2f6fdb);
  --edge: #8d8a80;
  --k-step: #2f6fdb; --k-code: #6c6960; --k-value: #b06f12; --k-helper: #7a57c9;
  --k-control: #0e8478; --k-unused: #9a978e; --implicit: #d9480f;
  --c-kw: #a626a4; --c-str: #3f8f3a; --c-num: #9a5b00; --c-com: #9a9a92;
  --c-fn: #2f6fdb; --c-bi: #b06f12; --c-local: #2f6fdb;
  --ui: var(--vscode-font-family, -apple-system, "Segoe UI", system-ui, sans-serif);
  --mono: var(--vscode-editor-font-family, ui-monospace, "SF Mono", Menlo, Consolas, monospace);
}
@media (prefers-color-scheme: dark) {
  body:not(.vscode-light) {
    --bg: var(--vscode-editor-background, #141517);
    --panel: var(--vscode-editorWidget-background, #1d1f23);
    --fg: var(--vscode-editor-foreground, #e7e5df);
    --muted: var(--vscode-descriptionForeground, #9c998f);
    --border: var(--vscode-editorWidget-border, #34373d);
    --edge: #73716a;
    --k-step: #6ea1ff; --k-code: #9c998f; --k-value: #e0a43c; --k-helper: #a98bf0;
    --k-control: #3cc4b4; --k-unused: #6f6d67; --implicit: #ff8a4c;
    --c-kw: #c678dd; --c-str: #98c379; --c-num: #d19a66; --c-com: #7f848e;
    --c-fn: #61afef; --c-bi: #e5c07b; --c-local: #6ea1ff;
  }
}
body.vscode-dark, body.vscode-high-contrast {
  --panel: var(--vscode-editorWidget-background, #1d1f23);
  --edge: #73716a;
  --k-step: #6ea1ff; --k-code: #9c998f; --k-value: #e0a43c; --k-helper: #a98bf0;
  --k-control: #3cc4b4; --k-unused: #6f6d67; --implicit: #ff8a4c;
  --c-kw: #c678dd; --c-str: #98c379; --c-num: #d19a66; --c-com: #7f848e;
  --c-fn: #61afef; --c-bi: #e5c07b; --c-local: #6ea1ff;
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; overflow: hidden; }
body { background: var(--bg); color: var(--fg); font: 13px/1.4 var(--ui); }
button { font: inherit; color: inherit; }

/* ---------- top bar ---------- */
.bar {
  position: absolute; inset: 0 0 auto 0; z-index: 20; display: flex; align-items: center; gap: 8px;
  padding: 8px 12px; background: color-mix(in srgb, var(--bg) 88%, transparent);
  backdrop-filter: blur(6px); border-bottom: 1px solid var(--border);
}
.bar .file { font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 30vw; }
.bar .stats { color: var(--muted); font-size: 12px; white-space: nowrap; }
.bar .spacer { flex: 1; }
.btn {
  border: 1px solid var(--border); background: var(--panel); border-radius: 6px;
  padding: 4px 9px; cursor: pointer; white-space: nowrap; font-size: 12px;
}
.btn:hover { border-color: var(--focus); }
.btn.primary { border-color: var(--k-step); color: var(--k-step); font-weight: 600; }
.btn[disabled] { opacity: .5; cursor: progress; }
.seg { display: inline-flex; }
.seg .btn { border-radius: 0; }
.seg .btn:first-child { border-radius: 6px 0 0 6px; }
.seg .btn:last-child { border-radius: 0 6px 6px 0; margin-left: -1px; }
.seg .btn[aria-pressed="true"] { background: color-mix(in srgb, var(--focus) 14%, var(--panel)); border-color: var(--focus); position: relative; }
.search {
  border: 1px solid var(--border); background: var(--panel); border-radius: 6px; padding: 4px 8px;
  width: 170px; font: 12px var(--ui); color: var(--fg);
}
.search:focus, .btn:focus-visible { outline: 2px solid var(--focus); outline-offset: 1px; }

.overview {
  position: absolute; top: 46px; left: 12px; right: 12px; z-index: 15; max-width: 820px;
  background: var(--panel); border: 1px solid var(--border); border-radius: 8px;
  padding: 8px 34px 8px 12px; box-shadow: 0 4px 16px rgba(0,0,0,.06); font-size: 12.5px;
}
.overview .src { color: var(--muted); font-size: 11px; text-transform: uppercase; letter-spacing: .06em; margin-right: 6px; }
#ov-text { display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; cursor: pointer; }
.overview.open #ov-text { -webkit-line-clamp: unset; display: inline; }
.chip.more { color: var(--muted); cursor: help; }
.overview .x { position: absolute; top: 4px; right: 6px; border: 0; background: none; cursor: pointer; color: var(--muted); font-size: 16px; }
.status { color: var(--muted); font-size: 12px; white-space: nowrap; }
.status.err { color: var(--implicit); }

/* ---------- canvas ---------- */
#viewport { position: absolute; inset: 0; overflow: hidden; overflow: clip; cursor: grab; touch-action: none;
  background-image: radial-gradient(var(--grid) 1px, transparent 1px); background-size: 22px 22px; }
#viewport.panning { cursor: grabbing; }
#world { position: absolute; left: 0; top: 0; transform-origin: 0 0; }
#edges { position: absolute; left: 0; top: 0; overflow: visible; pointer-events: none; }
#edges .e path.line { fill: none; stroke: var(--edge); stroke-width: 1.6; }
#edges .e.k-global path.line { stroke-dasharray: 5 4; }
#edges .e.k-calls path.line { stroke: var(--k-helper); stroke-dasharray: 2 4; }
#edges .e.k-implicit path.line { stroke: var(--implicit); stroke-dasharray: 7 4; stroke-width: 1.8; }
#edges .e .lbl rect { fill: var(--bg); stroke: var(--border); }
#edges .e .lbl text { font: 11px var(--mono); fill: var(--muted); }
#edges .e.k-implicit .lbl text { fill: var(--implicit); }
#edges .e.hot path.line { stroke: var(--focus); stroke-width: 2.4; }
#edges .e.k-implicit.hot path.line { stroke: var(--implicit); }
#edges .e.hot .lbl text { fill: var(--fg); }
#edges .e.k-global { opacity: .5; }
#edges .e.hot { opacity: 1; }
#edges .e.dim { opacity: .1; }
#edges .e.dim .lbl { display: none; }
#edges .stage rect { fill: color-mix(in srgb, var(--k-step) 5%, transparent); stroke: color-mix(in srgb, var(--k-step) 30%, transparent); stroke-dasharray: 4 4; }
#edges .stage text { font: 600 12px var(--ui); fill: color-mix(in srgb, var(--k-step) 75%, var(--fg)); letter-spacing: .04em; text-transform: uppercase; }

/* ---------- nodes ---------- */
.node {
  position: absolute; background: var(--panel); border: 1px solid var(--border); border-radius: 9px;
  box-shadow: 0 1px 2px rgba(0,0,0,.05), 0 6px 18px rgba(0,0,0,.05);
  border-top: 3px solid var(--kc); cursor: default; transition: opacity .15s, box-shadow .15s;
}
.node.k-step { --kc: var(--k-step); }
.node.k-code { --kc: var(--k-code); }
.node.k-value { --kc: var(--k-value); }
.node.k-helper { --kc: var(--k-helper); }
.node.k-control { --kc: var(--k-control); }
.node.k-unused { --kc: var(--k-unused); border-style: dashed; border-top-style: solid; opacity: .8; }
.node.sel { box-shadow: 0 0 0 2px var(--focus), 0 10px 26px rgba(0,0,0,.12); }
.node.match { box-shadow: 0 0 0 2px var(--k-value); }
.node.dim { opacity: .25; }
.node.dragging { box-shadow: 0 14px 34px rgba(0,0,0,.18); z-index: 5; }
.nh { display: flex; align-items: center; gap: 6px; padding: 7px 8px 6px 10px; cursor: grab; user-select: none; }
.nh:active { cursor: grabbing; }
.badge { font: 600 10px var(--mono); color: var(--kc); border: 1px solid color-mix(in srgb, var(--kc) 45%, transparent);
  border-radius: 4px; padding: 0 4px; text-transform: uppercase; letter-spacing: .03em; flex: none; }
.title { font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; }
.title.mono { font-family: var(--mono); font-size: 12.5px; }
.sig { font: 12px var(--mono); color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; flex: 1; }
.nh .grow { flex: 1; }
.ibtn { border: 1px solid transparent; background: none; border-radius: 4px; padding: 0 5px; cursor: pointer;
  color: var(--muted); font: 11px var(--mono); line-height: 18px; text-decoration: none; flex: none; }
.ibtn:hover { border-color: var(--border); color: var(--fg); }
.ctx { margin: 0 10px 4px; font: 11px var(--mono); color: var(--k-control); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.note { margin: 0 10px 4px; font-size: 12px; color: var(--muted); font-style: italic; }
.sum { margin: 0 10px 6px; font-size: 12.5px; line-height: 1.45; }
.sum::before { content: "✦ "; color: var(--implicit); }
.watch { margin: 0 10px 6px; font-size: 12px; line-height: 1.4; color: var(--k-value); }
.watch::before { content: "⚠ "; }
.note.doc { font-style: normal; color: var(--fg); opacity: .8; }
.io { display: flex; flex-wrap: wrap; gap: 4px; align-items: center; margin: 0 10px 7px; }
.io .l { font-size: 10.5px; color: var(--muted); text-transform: uppercase; letter-spacing: .05em; margin-right: 1px; }
.io .l + .chip { margin-left: 0; }
.io .sep { width: 6px; }
.chip { font: 11px var(--mono); border: 1px solid var(--border); border-radius: 10px; padding: 0 7px; line-height: 17px;
  background: var(--panel-2); cursor: pointer; }
.chip:hover { border-color: var(--focus); }
.chip.g { border-style: dashed; }
.chip.h { color: var(--k-helper); }
.callsite { margin: 0 8px 6px; border-radius: 6px; background: color-mix(in srgb, var(--k-step) 7%, transparent);
  border-left: 2px solid var(--k-step); }
.callsite .cap { font-size: 10.5px; color: var(--muted); padding: 3px 8px 0; text-transform: uppercase; letter-spacing: .05em; }
.body { border-top: 1px solid var(--border); max-height: 300px; overflow: auto; border-radius: 0 0 9px 9px; }
.node.full .body { max-height: none; }
.node.collapsed .body, .node.collapsed .callsite .code-more { display: none; }
pre.code { margin: 0; padding: 6px 0; font: 12px/1.55 var(--mono); tab-size: 4; }
pre.code .ln { display: grid; grid-template-columns: 38px 1fr; }
pre.code .no { color: var(--muted); opacity: .55; text-align: right; padding-right: 10px; user-select: none; }
pre.code .tx { white-space: pre; padding-right: 12px; }
.callsite pre.code { padding: 3px 0 5px; }
.t-kw { color: var(--c-kw); } .t-str { color: var(--c-str); } .t-num { color: var(--c-num); }
.t-com { color: var(--c-com); font-style: italic; } .t-fn { color: var(--c-fn); font-weight: 600; }
.t-bi { color: var(--c-bi); } .t-dec { color: var(--c-num); } .t-self { color: var(--c-kw); font-style: italic; }
.t-local { color: var(--c-local); text-decoration: underline; text-decoration-style: dotted; text-underline-offset: 3px; cursor: pointer; }

/* ---------- side panels ---------- */
.drawer { position: absolute; top: 46px; right: 12px; bottom: 12px; width: min(420px, calc(100vw - 24px)); z-index: 18;
  background: var(--panel); border: 1px solid var(--border); border-radius: 9px; overflow: auto;
  box-shadow: 0 10px 30px rgba(0,0,0,.12); }
.drawer h3 { margin: 0; padding: 10px 12px; font-size: 12px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted);
  display: flex; justify-content: space-between; border-bottom: 1px solid var(--border); }
.legend-btn { position: absolute; left: 12px; bottom: 12px; z-index: 16; }
.legend { position: absolute; left: 12px; bottom: 44px; z-index: 15; background: var(--panel); border: 1px solid var(--border);
  border-radius: 8px; padding: 8px 10px; font-size: 11.5px; display: grid; grid-template-columns: auto auto; gap: 3px 14px; }
.legend .it { display: flex; align-items: center; gap: 6px; white-space: nowrap; }
.legend .sw { width: 10px; height: 10px; border-radius: 2px; background: var(--kc); }
.legend svg { width: 26px; height: 8px; }
.legend .hint { grid-column: 1 / -1; color: var(--muted); border-top: 1px solid var(--border); padding-top: 5px; margin-top: 2px; white-space: normal; }
.zoom { position: absolute; right: 12px; bottom: 12px; z-index: 15; display: flex; gap: 4px; align-items: center; }
.zoom span { font: 11px var(--mono); color: var(--muted); min-width: 40px; text-align: center; }
.empty { position: absolute; inset: 0; display: grid; place-items: center; color: var(--muted); padding: 24px; text-align: center; }
[hidden] { display: none !important; }

/* ---------- sections ---------- */
.card { position: absolute; width: 360px; background: var(--panel); border: 1px solid var(--border); border-radius: 11px;
  box-shadow: 0 1px 2px rgba(0,0,0,.05), 0 8px 22px rgba(0,0,0,.06); --kc: var(--k-sec); border-top: 3px solid var(--k-sec);
  transition: opacity .15s, box-shadow .15s; }
.card .title { font-size: 13.5px; white-space: normal; line-height: 1.3; }
.card .lines { font: 11px var(--mono); color: var(--muted); flex: none; }
.card .open { color: var(--k-sec); border-color: color-mix(in srgb, var(--k-sec) 40%, transparent); font-family: var(--ui); font-weight: 600; }
.card .open:hover { background: color-mix(in srgb, var(--k-sec) 10%, transparent); }
.card .meta { margin: -2px 12px 6px; font-size: 11.5px; color: var(--muted); }
.card .sum { margin: 0 12px 8px; }
.card .io { margin: 0 12px 8px; }
.card ul.toc { list-style: none; margin: 0; padding: 6px 0 8px; border-top: 1px solid var(--border); }
.card ul.toc li { display: flex; align-items: center; gap: 7px; padding: 2px 12px; font-size: 12px; cursor: pointer;
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.card ul.toc li:hover { background: var(--panel-2); }
.card ul.toc li .mk { width: 7px; height: 7px; border-radius: 2px; background: var(--kc); flex: none; }
.card ul.toc li .tt { overflow: hidden; text-overflow: ellipsis; }
.card ul.toc li .tt.mono { font-family: var(--mono); font-size: 11.5px; }
.card ul.toc li.more { color: var(--muted); }
.card.sel { box-shadow: 0 0 0 2px var(--focus), 0 10px 26px rgba(0,0,0,.12); }
.card.match { box-shadow: 0 0 0 2px var(--k-value); }
.card.dim { opacity: .3; }
.card.dragging { box-shadow: 0 14px 34px rgba(0,0,0,.18); z-index: 5; }
.frame { position: absolute; border: 1.5px dashed color-mix(in srgb, var(--k-sec) 45%, transparent); border-radius: 14px;
  background: color-mix(in srgb, var(--k-sec) 4%, transparent); }
.frame .fh { display: flex; align-items: center; gap: 8px; height: 40px; padding: 0 12px; cursor: grab; user-select: none;
  --kc: var(--k-sec); }
.frame .fh .title { font-size: 13px; color: color-mix(in srgb, var(--k-sec) 70%, var(--fg)); }
.frame .fh .lines { font: 11px var(--mono); color: var(--muted); white-space: nowrap; flex: none; }
.frame .fh .title { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; }
.frame .fh .grow { flex: 1; }
.frame .fh .collapse { color: var(--k-sec); font-family: var(--ui); font-weight: 600; }
.chip.lk { border-style: dotted; color: var(--muted); }
.toc .k-step { --kc: var(--k-step); } .toc .k-code { --kc: var(--k-code); } .toc .k-value { --kc: var(--k-value); }
.toc .k-helper { --kc: var(--k-helper); } .toc .k-unused { --kc: var(--k-unused); }
#edges .e.sec path.line { stroke-width: 2.2; }
#edges .e.k-lookup path.line { stroke-dasharray: 1 4; opacity: .7; }
.menu { position: absolute; top: 44px; right: 12px; z-index: 30; background: var(--panel); border: 1px solid var(--border);
  border-radius: 9px; box-shadow: 0 10px 30px rgba(0,0,0,.14); padding: 6px; min-width: 250px; font-size: 12.5px; }
.menu .mi { display: flex; align-items: center; gap: 8px; width: 100%; text-align: left; border: 0; background: none;
  padding: 6px 8px; border-radius: 6px; cursor: pointer; }
.menu .mi:hover:not([disabled]) { background: var(--panel-2); }
.menu .mi[disabled] { opacity: .45; cursor: default; }
.menu .mi .ck { width: 14px; text-align: center; color: var(--focus); }
.menu .sep { height: 1px; background: var(--border); margin: 5px 4px; }
.menu .lbl { padding: 4px 8px 2px; color: var(--muted); font-size: 10.5px; text-transform: uppercase; letter-spacing: .06em; }
.drawer section { padding: 4px 0 10px; }
.drawer .lk-row { display: flex; gap: 8px; align-items: baseline; padding: 4px 12px; cursor: pointer; font-size: 12px; }
.drawer .lk-row:hover { background: var(--panel-2); }
.drawer .lk-row code { font: 12px var(--mono); }
.drawer .lk-row .m { color: var(--muted); margin-left: auto; white-space: nowrap; }
.drawer p.hint { margin: 6px 12px; color: var(--muted); font-size: 12px; }

body { --k-sec: #1f7a8c; }
@media (prefers-color-scheme: dark) { body:not(.vscode-light) { --k-sec: #4fb6c9; } }
body.vscode-dark, body.vscode-high-contrast { --k-sec: #4fb6c9; }

/* ---------- v0.4: branches, inputs, function flows ---------- */
.node.k-branch { --kc: var(--k-control); width: 380px; }
.node.k-branch .title { font-family: var(--mono); font-size: 12.5px; white-space: normal; }
.node.k-branch .arms { margin: 0 10px 8px; display: flex; flex-wrap: wrap; gap: 4px; }
.node.k-branch .arms .chip { color: var(--k-control); border-color: color-mix(in srgb, var(--k-control) 45%, transparent); cursor: default; }
.node.k-input { --kc: var(--k-value); width: 300px; }
.node.ret { border-bottom: 3px solid var(--k-step); }
.node .arm { margin: 0 10px 4px; font: 11px var(--mono); color: var(--k-control); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.ibtn.openflow { color: var(--k-helper); border-color: color-mix(in srgb, var(--k-helper) 40%, transparent); font-family: var(--ui); font-weight: 600; }
.ibtn.openflow:hover { background: color-mix(in srgb, var(--k-helper) 10%, transparent); }
.frame.flow { border-color: color-mix(in srgb, var(--k-helper) 50%, transparent); background: color-mix(in srgb, var(--k-helper) 4%, transparent); border-style: solid; }
.frame.flow .fh { --kc: var(--k-helper); height: 36px; }
.frame.flow .fh .title { color: color-mix(in srgb, var(--k-helper) 75%, var(--fg)); font-family: var(--mono); }
.frame.flow .fh .sig { font: 11.5px var(--mono); color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; }
.frame.flow .fh .collapse { color: var(--k-helper); }
#edges .e.k-branch path.line { stroke: var(--k-control); stroke-width: 1.8; }
#edges .e.k-branch .lbl text { fill: var(--k-control); }
#edges .e.k-branch .lbl rect { stroke: color-mix(in srgb, var(--k-control) 45%, transparent); }
.frame.entry { border-style: solid; border-width: 2px; border-color: color-mix(in srgb, var(--k-step) 55%, transparent); background: color-mix(in srgb, var(--k-step) 3%, transparent); }
.frame.entry .fh { --kc: var(--k-step); }
.frame.entry .fh .title { color: color-mix(in srgb, var(--k-step) 75%, var(--fg)); font-family: var(--mono); }
.frame.entry .fh .sig { font: 11.5px var(--ui); color: var(--muted); }
/* ---------- Read page ---------- */
.read { position: absolute; inset: 44px 0 0 0; z-index: 12; overflow: auto; background: var(--bg); }
.read article { max-width: 860px; margin: 0 auto; padding: 28px 24px 80px; font-size: 14.5px; line-height: 1.6; }
.read h1 { font-size: 22px; margin: 0 0 6px; }
.read h1 code { font: 600 20px var(--mono); }
.read .lead { color: var(--muted); margin: 0 0 18px; }
.read h2 { font-size: 17px; margin: 34px 0 8px; padding-bottom: 6px; border-bottom: 1px solid var(--border); }
.read h2 .lines, .read h3 .lines { font: 11px var(--mono); color: var(--muted); margin-left: 8px; }
.read h2.entry { color: var(--k-step); }
.read h3 { font-size: 15px; margin: 22px 0 6px; color: var(--k-sec); }
.read h3.fn { color: var(--k-helper); font-family: var(--mono); }
.read h3.fn .sig { font-weight: 400; color: var(--muted); font-size: 13px; }
.read p { margin: 6px 0 10px; }
.read p.narr { background: color-mix(in srgb, var(--implicit) 6%, transparent); border-left: 3px solid var(--implicit); padding: 8px 12px; border-radius: 0 6px 6px 0; }
.read p.narr::before { content: "✦ "; color: var(--implicit); }
.read ul.io { margin: 0 0 10px; padding-left: 18px; }
.read article { counter-reset: step; }
.read ol.steps { list-style: none; margin: 0; padding: 0; }
body.reading #b-fit, body.reading #seg-level, body.reading .seg[aria-label="Layout direction"], body.reading #b-tidy, body.reading .zoom, body.reading .legend-btn, body.reading .legend { display: none !important; }
.read ol.steps > li { counter-increment: step; display: grid; grid-template-columns: 34px 1fr; gap: 6px 10px; padding: 8px 8px; border-radius: 8px; cursor: pointer; }
.read ol.steps > li:hover { background: var(--panel-2); }
.read ol.steps > li::before { content: counter(step); font: 600 13px var(--mono); color: var(--muted); text-align: right; padding-top: 2px; }

  const kinds = [["step", "main(): the program"], ["sec", "section (Open ▸)"], ["helper", "function (Open flow ▸)"], ["step", "function call"], ["code", "top-level code"], ["value", "settings / inputs"], ["control", "branch: one arm runs"]];
  const lines = [["--edge", "variable passed on", ""], ["--k-control", "branch arm", ""], ["--k-helper", "calls helper", "2 4"], ["--implicit", "Claude: hidden link", "7 4"],
                 ["--edge", "global read (View ▾ to show)", "5 4"], ["--focus", "direct link of the selected block", ""]];
  const sw = (c, dash) => `<svg viewBox="0 0 26 8"><line x1="0" y1="4" x2="26" y2="4" style="stroke:var(${c});stroke-width:2;stroke-dasharray:${dash}"/></svg>`;
  $("legend").innerHTML = kinds.map(([k, l]) => `<span class="it" data-k="${k}"><span class="sw"></span>${l}</span>`).join("") +
    `<span class="it"><span class="chip lk">NAME</span>lookup: tag, no arrow</span>` +
    lines.map(([c, l, dash]) => `<span class="it">${sw(c, dash)}${l}</span>`).join("") +
    `<span class="it hint">scroll: pan · ⌘/ctrl+scroll or pinch: zoom · click a block: its lineage stays, the rest fades · Esc: clear</span>`;
  document.querySelectorAll(".legend [data-k]").forEach((el) => el.style.setProperty("--kc", `var(--k-${el.dataset.k})`));
}
function setDir(d) {
  if (d === dir || !G) return;
  dir = d; syncControls(); layoutAll(false); place(); drawEdges(); initialView(); save();
}
function setGroup(mode) {
  if (!G) return;
  groupMode = mode; buildAll(); layoutAll(false); place(); drawEdges(); initialView(); save();
  $("menu").hidden = true;
}
// ---------------------------------------------------------------- Read page
function setTab(t) {
  tab = t === "read" ? "read" : "map";
  $("read").hidden = tab !== "read";
  document.body.classList.toggle("reading", tab === "read");
  $("overview").hidden = tab === "read" || !($("ov-text").textContent) || overviewClosed;
  document.querySelectorAll("#seg-tab [data-tab]").forEach((b) => b.setAttribute("aria-pressed", String(b.dataset.tab === tab)));
  if (tab === "map") requestAnimationFrame(() => { layoutAll(false); place(); drawEdges(); });
  save();
}
function goToStep(id, flowName) {
  setTab("map");
  if (!flowName) { focusNode(id); return; }
  // A step inside a function: open that function's flow (from its first call site) and focus the inner block.
  let block = [...NODES.values()].find((n) => n.def === flowName && !n.inFlow) || [...NODES.values()].find((n) => n.def === flowName);
  if (!block) return;
  let cid = openFlowOf.get(block.id);
  if (!cid) { cid = openFlow(block.id); if (!cid) return; refresh(parentOf.get(block.id)); }
  requestAnimationFrame(() => focusNode(cid + "/" + id));
}
const codeList = (vars) => vars.map((v) => `<span class="v">${esc(v)}</span>`).join(" ");
function stepHTML(n, flowName) {
  const d = n.def ? G.defs[n.def] : null;
  const en = noteOf(n);
  const lines = n.lines[1] > n.lines[0] ? `L${n.lines[0]}–${n.lines[1]}` : `L${n.lines[0]}`;
  const loc = vscodeApi ? `<span class="l" data-line="${n.lines[0]}" data-end="${n.lines[1]}" title="Show in editor">${lines}</span>` : `<span class="l">${lines}</span>`;
  const go = `data-go="${esc(n.innerId || n.id)}"${flowName ? ` data-flow="${esc(flowName)}"` : ""}`;
  if (n.kind === "branch") {
    return `<li class="branch" ${go}><div class="t">${esc(n.title)}${loc}</div>` +
      (en && en.summary ? `<div class="d sum">${esc(en.summary)}</div>` : `<div class="d muted">One of ${n.arms.length} arms runs, depending on ${codeList(n.reads)}.</div>`) + `</li>`;
  }
  let title;
  if (d) title = `Call <code>${esc(d.name)}(${esc(d.params.join(", "))})</code>`;
  else if (n.kind === "input") title = "Inputs";
  else if (n.kind === "value") title = `Settings: ${codeList(n.writes.slice(0, 4))}${n.writes.length > 4 ? " …" : ""}`;
  else title = n.title_from === "code" ? `<code>${esc(n.title)}</code>` : esc(cap(n.title));
  if (n.kind === "helper" || n.kind === "unused") title = `Define <code>${esc(d.name)}(${esc(d.params.join(", "))})</code>` + (n.kind === "unused" ? " <span class='muted'>(never called)</span>" : " <span class='muted'>(used by later steps)</span>");
  const ex = exportedBy.get(n.id) || new Set();
  const outs = (n.writes || []).filter((v) => ex.has(v));
  const io = [];
  if (n.reads && n.reads.length) io.push(`takes ${codeList(n.reads)}`);
  if (n.lookups && n.lookups.length) io.push(`uses ${codeList(n.lookups)}`);
  if (outs.length) io.push(`produces ${codeList(outs)}`);
  if (n.returns) io.push(`<b>returns</b>`);
  let h = `<li ${go}><div class="t">${title}${loc}</div>`;
  if (d && d.doc) h += `<div class="d doc">${esc(d.doc)}</div>`;
  if (en && en.summary) h += `<div class="d sum">${esc(en.summary)}</div>`;
  if (en && en.watch) h += `<div class="d watch">${esc(en.watch)}</div>`;
  if (io.length) h += `<div class="d io">${io.join(" · ")}</div>`;
  return h + `</li>`;
}
// Steps in run order with branch arms nested under their branch.
function stepsHTML(nodes, flowName) {
  let h = `<ol class="steps">`, i = 0;
  while (i < nodes.length) {
    const n = nodes[i];
    if (n.kind === "branch") {
      const bid = n.innerId || n.id;
      h += stepHTML(n, flowName).replace(/<\/li>$/, "");
      let j = i + 1, lastArm = null, armOpen = false;
      while (j < nodes.length && nodes[j].arm && nodes[j].arm.of === bid) {
        if (nodes[j].arm.label !== lastArm) {
          if (armOpen) h += `</ol>`;
          h += `<div class="armhead">↳ ${esc(nodes[j].arm.label)}</div><ol class="steps">`;
          lastArm = nodes[j].arm.label; armOpen = true;
        }
        h += stepHTML(nodes[j], flowName);
        j++;
      }
      if (armOpen) h += `</ol>`;
      h += `</li>`;
      i = j;
    } else { h += stepHTML(n, flowName); i++; }
  }
  return h + `</ol>`;
}
function buildRead() {
  const E2 = E || {};
  const srcOrder = (a, b) => NODES.get(a).lines[0] - NODES.get(b).lines[0];
  let h = `<h1>How <code>${esc(G.file_name)}</code> works</h1>`;
  const lead = E2.summary || G.module_doc;
  if (lead) h += `<p class="lead">${esc(lead)}</p>`;
  if (!E2.summary) h += `<p class="muted">This walkthrough is built from the code's structure alone. Run ✦ Explain with Claude for plain-English notes and narrative.</p>`;
  if (E2.inputs && E2.inputs.length) h += `<p><b>Reads:</b></p><ul class="io">${E2.inputs.map((x) => `<li>${esc(x)}</li>`).join("")}</ul>`;
  if (E2.outputs && E2.outputs.length) h += `<p><b>Writes:</b></p><ul class="io">${E2.outputs.map((x) => `<li>${esc(x)}</li>`).join("")}</ul>`;

  h += `<h2>Step by step</h2>`;
  const secNarr = (c) => {
    if (!E2.sections && !E2.stages) return "";
    const secN = E2.sections && E2.sections[c.id.replace(/m$/, "")] && E2.sections[c.id.replace(/m$/, "")].narrative;
    const stage = Array.isArray(E2.stages) && E2.stages.find((st) => st.name === c.title);
    const t = secN || (stage && stage.narrative);
    return t ? `<p class="narr">${esc(t)}</p>` : "";
  };
  const renderContainer = (cid, level) => {
    const c = CONT.get(cid);
    let out = "";
    if (c.kind === "entry") {
      out += `<h2 class="entry"><code>${esc(c.title)}()</code> — the program<span class="lines">L${c.lines[0]}–${c.lines[1]}</span></h2>`;
      out += `<p class="muted">Everything below runs when the script is executed; the settings and helpers above are defined first.</p>`;
    } else if (c.kind === "section" && !c.synthetic) {
      out += `<h3>${esc(cap(c.title))}<span class="lines">L${c.lines[0]}–${c.lines[1]}</span></h3>`;
      if (c.summary) out += `<p>${esc(c.summary)}</p>`;
      out += secNarr(c);
    }
    const kids = c.children.slice();
    const leafKids = kids.filter((k) => isLeaf(k)).sort(srcOrder);
    const contKids = kids.filter((k) => isCont(k));
    if (contKids.length) {
      // Interleave child containers with loose blocks by line.
      const items = [...leafKids.map((k) => ({ k, line: NODES.get(k).lines[0], leaf: true })), ...contKids.map((k) => ({ k, line: CONT.get(k).lines[0], leaf: false }))].sort((a, b) => a.line - b.line);
      let run = [];
      const flush = () => { if (run.length) { out += stepsHTML(run.map((k) => NODES.get(k))); run = []; } };
      for (const it of items) { if (it.leaf) run.push(it.k); else { flush(); out += renderContainer(it.k, level + 1); } }
      flush();
    } else if (leafKids.length) {
      out += stepsHTML(leafKids.map((k) => NODES.get(k)));
    }
    return out;
  };
  for (const cid of ROOT) h += renderContainer(cid, 0);

  const flows = Object.values(G.flows || {});
  if (flows.length) {
    h += `<h2>Functions in depth</h2><p class="muted">Each function's body, step by step. Click a step to open the function on the map.</p>`;
    for (const f of flows) {
      const d = G.defs[f.name];
      h += `<h3 class="fn">${esc(f.name)}<span class="sig">(${esc(f.params.join(", "))})</span><span class="lines">L${f.lines[0]}–${f.lines[1]}</span></h3>`;
      if (d && d.doc) h += `<p class="muted">${esc(d.doc)}</p>`;
      const fn = E2.functions && E2.functions[f.name];
      if (fn && fn.narrative) h += `<p class="narr">${esc(fn.narrative)}</p>`;
      const inner = f.nodes.filter((n) => n.kind !== "input").map((n) => ({ ...n, innerId: n.id, flowName: f.name }));
      h += stepsHTML(inner, f.name);
    }
  }

  const know = [];
  if (Array.isArray(E2.implicit_edges)) for (const e of E2.implicit_edges) {
    if (NODES.has(e.source) && NODES.has(e.target)) know.push(`<b>Hidden link:</b> ${esc(NODES.get(e.source).title)} → ${esc(NODES.get(e.target).title)} — ${esc(e.reason || e.label || "")}`);
  }
  if (E2.nodes) for (const [id, v] of Object.entries(E2.nodes)) if (v.watch) {
    const n = NODES.get(id); const label = n ? (n.def || n.title) : id.replace("/", " › ");
    know.push(`<b>${esc(label)}:</b> ${esc(v.watch)}`);
  }
  for (const n of G.nodes) if (n.kind === "unused") know.push(`<code>${esc(n.def)}()</code> is defined but never called.`);
  if (G.lookups && G.lookups.length) know.push(`Used almost everywhere: ${codeList(G.lookups.map((l) => l.name))}.`);
  if (know.length) h += `<h2>Things to know</h2><ul class="know">${know.map((k) => `<li>${k}</li>`).join("")}</ul>`;
  h += `<p class="back">Click any step to see it on the map · press R to switch views</p>`;
  $("read-body").innerHTML = h;
  $("read").hidden = tab !== "read";
  document.body.classList.toggle("reading", tab === "read");
  document.querySelectorAll("#seg-tab [data-tab]").forEach((b) => b.setAttribute("aria-pressed", String(b.dataset.tab === tab)));
  if (tab === "read") $("overview").hidden = true;
}

function setStatus(text, isErr) { const s = $("status"); s.textContent = text || ""; s.classList.toggle("err", !!isErr); }

// ---------------------------------------------------------------- load / update
function load(graph, enrich, keepView) {
  if (graph && graph.error) { setStatus(graph.error + (graph.line ? ` (line ${graph.line})` : ""), true); return; }
  G = graph;
  E = enrich && enrich.source_hash && enrich.source_hash !== graph.source_hash ? null : enrich;
  if (!keepView) {
    const saved = loadSaved();
    if (saved) {
      dir = saved.dir === "TB" ? "TB" : "LR";
      groupMode = saved.groupMode || "comments"; showLookups = !!saved.showLookups; showGlobals = !!saved.showGlobals;
      foldCode = !!saved.foldCode; wheelZooms = !!saved.wheelZooms; tab = saved.tab === "read" ? "read" : "map";
      store = { TB: saved.TB || { top: {}, inner: {} }, LR: saved.LR || { top: {}, inner: {} } };
      savedOpen = saved.grouped ? saved.open || [] : null;   // a flat map saved nothing worth restoring
    }
  }
  buildAll();
  requestAnimationFrame(() => { layoutAll(false); place(); drawEdges(); if (!keepView) initialView(); });
}
function applyEnrichment(enrich) {
  E = enrich; buildAll();
  requestAnimationFrame(() => { layoutAll(true); place(); drawEdges(); save(); initialView(); });
}

window.addEventListener("message", (ev) => {
  const m = ev.data || {};
  if (m.type === "graph") { load(m.graph, m.enrichment, !!G); setStatus(""); }
  else if (m.type === "enrichment") { applyEnrichment(m.enrichment); setStatus(""); }
  else if (m.type === "status") { if ("text" in m) setStatus(m.text, m.error); $("b-explain").disabled = !!m.busy; }
});

setupToolbar();
setupInteraction();
if (window.__CF_GRAPH__) load(window.__CF_GRAPH__, window.__CF_ENRICH__, false);
if (vscodeApi) vscodeApi.postMessage({ type: "ready" });
})();
</script>
